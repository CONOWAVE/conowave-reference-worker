name = "conowave-reference-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Kein Cron. Das Konto ist auf Workers Free und hat die 5 Cron-Trigger je
# Konto bereits ausgeschoepft. Ausgeloest wird ueber Webhooks:
#   metaobjects/create und metaobjects/update, Filter type:projekt
#   articles/create und articles/update
# Der manuelle Anstoss ueber POST /run bleibt als Rueckfallebene.

[vars]
SHOPIFY_SHOP = "prfu7j-1q.myshopify.com"
SHOPIFY_API_VERSION = "2026-04"

# Secrets, nicht hier eintragen, sondern:
#   wrangler secret put SHOPIFY_CLIENT_ID
#   wrangler secret put SHOPIFY_CLIENT_SECRET
#   wrangler secret put SHOPIFY_WEBHOOK_SECRET
#   wrangler secret put ADMIN_TOKEN

[[kv_namespaces]]
binding = "REF_CACHE"
id = "2dd45716a7a542a39c4885544ed46ee9"

[observability]
enabled = true
