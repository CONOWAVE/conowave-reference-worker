name = "conowave-reference-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Ausgeloest wird vor allem ueber Webhooks, siehe README:
#   metaobjects/create, metaobjects/update, metaobjects/delete
#   jeweils mit Filter type:projekt
#
# Das Netz fuer verlorene Webhooks laeuft vorerst ueber n8n, ein taeglicher
# Aufruf auf POST /run. Grund: Cron-Trigger sind auf Workers Free auf fuenf
# je Konto begrenzt und waren bereits ausgeschoepft, verteilt auf
# conowave-erp-worker und conowave-b2b-worker.
#
# Sobald Workers Paid gebucht ist, die folgenden zwei Zeilen einkommentieren
# und den n8n-Ablauf abschalten. 05:00 und 15:00 UTC sind 06:00 und 16:00
# deutscher Zeit im Winter.
#
# [triggers]
# crons = ["0 5,15 * * *"]

[vars]
SHOPIFY_SHOP = "prfu7j-1q.myshopify.com"
SHOPIFY_API_VERSION = "2026-04"

# Secrets, nicht hier eintragen, sondern:
#   wrangler secret put SHOPIFY_CLIENT_ID
#   wrangler secret put SHOPIFY_CLIENT_SECRET
#   wrangler secret put SHOPIFY_WEBHOOK_SECRET
#   wrangler secret put ADMIN_TOKEN

[[kv_namespaces]]
binding = "REF_CACHE"
id = "2dd45716a7a542a39c4885544ed46ee9"

[observability]
enabled = true
